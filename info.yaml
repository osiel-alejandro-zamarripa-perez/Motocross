# Tiny Tapeout project information
project:
  title:        "VGA Motorcycle Racing Game"
  author:       "Osiel  Zamarripa and Rodrigo ibarra"
  discord:      "Superez34"
  description:  "4-player VGA motorcycle racing game with sub-pixel physics and selectable tracks"
  language:     "Verilog"
  clock_hz:     25175000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_".
  top_module:  "tt_um_KK_VGA01"

  # List your project's source files here.
  source_files:
    - "project.v"
    - "hvsync_generator.v"
    - "track_gen.v"
    - "dir_steer.v"
    - "motor_handler.v"
    - "motor_core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs (dir_in[7:0]: cada jugador usa {sentido, eje})
  ui[0]: "P1_EJE"
  ui[1]: "P1_SENTIDO"
  ui[2]: "P2_EJE"
  ui[3]: "P2_SENTIDO"
  ui[4]: "P3_EJE"
  ui[5]: "P3_SENTIDO"
  ui[6]: "P4_EJE"
  ui[7]: "P4_SENTIDO"

  # Outputs (TinyVGA PMOD)
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSYNC"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSYNC"

  # Bidirectional pins (usados como entradas de configuracion)
  uio[0]: "GAME_TRACK_0"
  uio[1]: "GAME_TRACK_1"
  uio[2]: "GAME_SPEED_0"
  uio[3]: "GAME_SPEED_1"
  uio[4]: "USER_RESET"
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
